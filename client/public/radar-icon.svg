<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#radarBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Concentric Distance Rings -->
  <circle cx="256" cy="256" r="200" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="140" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="80" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="20" y1="256" x2="492" y2="256" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 256 56 A 200 200 0 0 1 430 156 Z" fill="url(#sweepGrad)" opacity="0.6" />

  <!-- Center User Location Pin -->
  <circle cx="256" cy="256" r="14" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Walk-In Blip (Crimson Glowing) -->
  <circle cx="340" cy="180" r="12" fill="#ef4444" filter="url(#glow)" />
  <circle cx="340" cy="180" r="20" stroke="#ef4444" stroke-width="2" stroke-opacity="0.7" />

  <!-- Hiring Blip (Neon Green Glowing) -->
  <circle cx="180" cy="330" r="10" fill="#10b981" filter="url(#glow)" />
  <circle cx="180" cy="330" r="16" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" />

  <!-- Normal Company Blip (White) -->
  <circle cx="330" cy="330" r="7" fill="#94a3b8" />
</svg>
